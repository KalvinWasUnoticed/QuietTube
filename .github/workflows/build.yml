name: Build QuietTube library
run-name: QuietTube 1.0.0 — library only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Test and build library (no YouTube app)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify release files and run regression tests
        run: bash scripts/check.sh
      - name: Compile QuietTube only
        run: bash scripts/build.sh
      - name: Record library integrity and build identity
        run: python scripts/build_info.py
      - name: Upload library (not an IPA)
        id: library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QuietTube-1.0.0-library
          path: |
            artifacts/QuietTube.dylib
            artifacts/BUILD-INFO.json
            artifacts/SHA256SUMS
            LICENSE
            Notices/*.txt
            Notices/REFERENCES.md
          if-no-files-found: error
          retention-days: 7
      - name: Show download and next steps
        env:
          ARTIFACT_URL: ${{ steps.library.outputs.artifact-url }}
        run: |
          {
            echo '# QuietTube library ready'
            echo "[Download library artifact (ZIP)]($ARTIFACT_URL)"
            echo ''
            echo 'This contains QuietTube only, NOT an installable IPA or the YouTube app.'
            echo 'Extract artifacts/QuietTube.dylib. Keep BUILD-INFO.json and SHA256SUMS for verification.'
            echo 'Follow docs/INSTALL.md in this same source commit for local packaging with your own authorized compatible base.'
            echo "Source commit: $GITHUB_SHA"
            echo 'Artifacts expire after seven days. GitHub sign-in and repository access may be required.'
          } >> "$GITHUB_STEP_SUMMARY"
