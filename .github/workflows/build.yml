name: Build QuietTube IPA
run-name: QuietTube 1.0.0 — user-provided base
on:
  workflow_dispatch:
    inputs:
      base_ipa_url:
        description: 'Direct HTTPS URL to your authorized decrypted YouTube 21.38.2 IPA. Exact supported SHA256 required; see docs/INSTALL.md.'
        type: string
        required: true
      acknowledge_rights:
        description: 'I have the necessary rights to use, modify and publish this app. I understand the output is public if my fork is public.'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  build:
    name: Build and release in your fork
    if: github.event.repository.fork == true && inputs.acknowledge_rights == true
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      IPA_PATH: artifacts/QuietTube-1.0.0-21.38.2.ipa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify sources and run regression tests
        run: bash scripts/check.sh
      - name: Download and validate user-provided base
        timeout-minutes: 7
        env:
          BASE_IPA_URL: ${{ inputs.base_ipa_url }}
        run: python scripts/download_base.py
      - name: Compile the native tweak
        run: bash scripts/build.sh
      - name: Package and verify the exact output
        run: |
          python scripts/package.py "$RUNNER_TEMP/QuietTube-base.ipa" artifacts/QuietTube.dylib "$IPA_PATH"
          test -s "$IPA_PATH" || { echo '::error::Expected IPA output missing'; exit 1; }
          ls -lh "$IPA_PATH"
      - name: Publish IPA to this fork and show download link
        env:
          GH_TOKEN: ${{ github.token }}
          IS_FORK: ${{ github.event.repository.fork }}
          ACKNOWLEDGE_RIGHTS: ${{ inputs.acknowledge_rights }}
        run: python scripts/publish.py
      - name: Remove downloaded base and temporary outputs
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/QuietTube-base.ipa"
          rm -rf artifacts
      - name: Explain failure
        if: failure()
        run: |
          echo '## Build/publication failed — no successful download is confirmed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Open the failed step. If publication failed, check Releases for an incomplete draft before rebuilding. Do not use an older IPA by mistake.' >> "$GITHUB_STEP_SUMMARY"
