name: Build QuietTube dylib — EXPERIMENTAL SponsorSkip
run-name: QuietTube 1.3.0-exp — dylib (experimental)
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as a prerelease (experimental — always prerelease).'
        type: boolean
        required: true
        default: true
      acknowledge_rights:
        description: 'I have the necessary rights to publish this experimental library.'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  build:
    name: Build EXPERIMENTAL dylib
    if: ${{ (github.ref == 'refs/heads/Experimental' || github.ref == 'refs/heads/exp/sponsorskip' || startsWith(github.ref, 'refs/heads/exp/')) && (github.repository == 'KalvinWasUnoticed/QuietTube' || github.event.repository.fork == true) && inputs.acknowledge_rights == true }}
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify sources and run regression tests
        run: bash scripts/check.sh
      - name: Compile the native tweak (experimental)
        run: bash scripts/build.sh
      - name: Publish EXPERIMENTAL dylib
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KIND: dylib
          IS_FORK: ${{ github.event.repository.fork }}
          ACKNOWLEDGE_RIGHTS: ${{ inputs.acknowledge_rights }}
          PRERELEASE: true
        run: python scripts/publish.py
      - name: Remove temporary outputs
        if: always()
        run: rm -rf artifacts
      - name: Explain failure
        if: failure()
        run: |
          echo '## EXPERIMENTAL dylib failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Experimental branch may fail. Stable dylib on main is not affected.' >> "$GITHUB_STEP_SUMMARY"
