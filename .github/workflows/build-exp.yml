name: Build QuietTube IPA — EXPERIMENTAL SponsorSkip
run-name: QuietTube 1.3.0-exp — SponsorSkip (experimental)
on:
  workflow_dispatch:
    inputs:
      base_ipa_url:
        description: 'EXPERIMENTAL — Fork first. Paste direct link to decrypted YouTube 21.38.2 IPA. SponsorSkip is off by default, hash-private.'
        type: string
        required: true
      acknowledge_rights:
        description: 'I have the necessary rights to use, modify and publish this app. EXPERIMENTAL build — may fail. I understand the output is public if my fork is public.'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  build:
    name: Build EXPERIMENTAL IPA (SponsorSkip)
    if: ${{ (github.ref == 'refs/heads/Experimental' || github.ref == 'refs/heads/exp/sponsorskip' || startsWith(github.ref, 'refs/heads/exp/')) && github.event.repository.fork == true && inputs.acknowledge_rights == true }}
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      IPA_PATH: artifacts/QuietTube-1.3.0-exp-21.38.2.ipa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify sources and run regression tests
        run: bash scripts/check.sh
      - name: Compile the native tweak (experimental)
        run: bash scripts/build.sh
      - name: Download and validate user-provided base
        timeout-minutes: 7
        env:
          BASE_IPA_URL: ${{ inputs.base_ipa_url }}
        run: python scripts/download_base.py
      - name: Package and verify the exact output
        run: |
          python scripts/package.py "$RUNNER_TEMP/QuietTube-base.ipa" artifacts/QuietTube.dylib "$IPA_PATH"
          test -s "$IPA_PATH" || { echo '::error::Expected IPA output missing'; exit 1; }
          ls -lh "$IPA_PATH"
          echo "## EXPERIMENTAL — SponsorSkip off by default" >> "$GITHUB_STEP_SUMMARY"
          echo "Segments are community data and can be wrong/censored. See Quiet controls → SponsorSkip disclaimer." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish EXPERIMENTAL IPA and dylib
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KIND: ipa
          IS_FORK: ${{ github.event.repository.fork }}
          ACKNOWLEDGE_RIGHTS: ${{ inputs.acknowledge_rights }}
          PRERELEASE: true
        run: python scripts/publish.py
      - name: Remove downloaded base and temporary outputs
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/QuietTube-base.ipa"
          rm -rf artifacts
      - name: Explain failure
        if: failure()
        run: |
          echo '## EXPERIMENTAL build failed — no successful download is confirmed' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is an experimental branch and may fail. Check the failed step. Stable 1.2.0 builds on main are not affected.' >> "$GITHUB_STEP_SUMMARY"
